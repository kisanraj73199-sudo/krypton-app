name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Stamp Version Manifest & Sync Capacitor
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          VER_CODE=$((200 + ${GITHUB_RUN_NUMBER:-1}))
          APK_VER="2.5.${VER_CODE}"
          COMMIT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g')
          FEAT_VER=$(grep -oE "v[0-9]{5}" www/app.js | tail -1)
          if [ -z "$FEAT_VER" ]; then FEAT_VER="v70000"; fi
          BUILD_TS=$(date +%s)

          cat <<EOF > www/version.json
          {
            "version": "${APK_VER}",
            "apkVersion": "${APK_VER}",
            "versionCode": ${VER_CODE},
            "featureVersion": "${FEAT_VER}",
            "commit": "${COMMIT_SHA}",
            "timestamp": ${BUILD_TS},
            "notes": "${COMMIT_MSG}",
            "repo": "${GITHUB_REPOSITORY}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/krypton.apk"
          }
          EOF
          cat www/version.json

          npm install -g @capacitor/cli @capacitor/assets
          npm install --legacy-peer-deps

          if [ -n "$SECRET_URL" ] && [ -n "$SECRET_KEY" ]; then
            sed -i "s|const RAW_URL = \"your url\";|const RAW_URL = \"$SECRET_URL\";|g" www/app.js
            sed -i "s|const RAW_KEY = \"your key\";|const RAW_KEY = \"$SECRET_KEY\";|g" www/app.js
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $VER_CODE/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"$APK_VER\"/g" android/app/build.gradle
          fi

          mkdir -p assets
          if [ -f "www/icon-512.png" ] && [ ! -f "assets/icon.png" ]; then
            cp www/icon-512.png assets/icon.png
          fi
          if [ -f "assets/icon.png" ]; then
            cp -f assets/icon.png www/icon-192.png
            cp -f assets/icon.png www/icon-512.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#06080f' --iconBackgroundColorDark '#06080f' --splashBackgroundColor '#06080f' --splashBackgroundColorDark '#06080f'
          fi
          npx cap sync android

      - name: Verify Persistent APK Signing Keystore
        run: |
          mkdir -p ~/.android
          KEYSTORE_FILE="android/app/krypton-master.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "CRITICAL ERROR: android/app/krypton-master.jks is not committed to Git!"
            exit 1
          fi
          cp -f "$KEYSTORE_FILE" ~/.android/debug.keystore
          cp -f "$KEYSTORE_FILE" android/app/debug.keystore

      - name: Build Android Debug APK & Rename to krypton.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/krypton.apk

      - name: Upload krypton.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: krypton-apk
          path: android/app/build/outputs/apk/debug/krypton.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish krypton.apk & version.json to GitHub Releases (Bulletproof CLI with Auto-Retry)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure git tag 'latest' points to the current commit
          git tag -f latest
          git push origin latest --force

          # Create 'latest' release if it doesn't exist yet, otherwise update its title
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Krypton Latest APK" \
              --notes "Latest Krypton Android APK Release"
          else
            gh release edit latest \
              --title "Krypton Latest APK" \
              --notes "Latest Krypton Android APK Release"
          fi

          # Upload krypton.apk & version.json with --clobber (overwrite) and up to 3 automatic retries
          for attempt in 1 2 3; do
            echo "Uploading release assets (Attempt $attempt)..."
            if gh release upload latest \
              android/app/build/outputs/apk/debug/krypton.apk \
              www/version.json \
              --clobber; then
              echo "✅ Both krypton.apk and version.json uploaded successfully!"
              break
            fi
            echo "Upload glitch detected, retrying in 5 seconds..."
            sleep 5
          done