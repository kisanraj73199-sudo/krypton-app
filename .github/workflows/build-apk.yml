name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js 22 (Required for @capacitor/cli@8.6.0 & @capacitor/assets)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Setup Java 21
      - name: Setup Java JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Verify Java
      - name: Verify Java Version
        run: |
          java -version
          javac -version

      # Install Dependencies, Generate App Icons & Sync Capacitor
      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/assets
          npm install --legacy-peer-deps
          mkdir -p assets
          if [ -f "www/icon-512.png" ] && [ ! -f "assets/icon.png" ]; then
            cp www/icon-512.png assets/icon.png
          fi
          if [ -f "assets/icon.png" ]; then
            cp -f assets/icon.png www/icon-192.png
            cp -f assets/icon.png www/icon-512.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#06080f' --iconBackgroundColorDark '#06080f' --splashBackgroundColor '#06080f' --splashBackgroundColorDark '#06080f'
          fi
          npx cap sync android

      # Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7